<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="currentColor">
  <!-- Фравахар (крылатый зороастрийский символ) -->
  <!-- Кольцо в центре -->
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <!-- Фигура (бюст) над кольцом -->
  <circle cx="16" cy="9" r="2" fill="currentColor"/>
  <path d="M14,11 L18,11 L17,15 L15,15 Z" fill="currentColor"/>
  <!-- Левое крыло -->
  <path d="M12,15 L2,12 L2,17 L12,17 Z" fill="currentColor" opacity="0.85"/>
  <path d="M12,17 L4,18 L4,21 L12,19 Z" fill="currentColor" opacity="0.7"/>
  <!-- Правое крыло -->
  <path d="M20,15 L30,12 L30,17 L20,17 Z" fill="currentColor" opacity="0.85"/>
  <path d="M20,17 L28,18 L28,21 L20,19 Z" fill="currentColor" opacity="0.7"/>
  <!-- Хвост перьев снизу -->
  <polygon points="13,20 19,20 18,28 14,28" fill="currentColor"/>
  <line x1="16" y1="20" x2="16" y2="28" stroke="#000" stroke-width="0.4" opacity="0.4"/>
</svg>
