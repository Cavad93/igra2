<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="currentColor">
  <!-- Меч (нейтральный символ) -->
  <!-- Лезвие -->
  <polygon points="16,2 18,4 18,22 16,24 14,22 14,4" fill="currentColor"/>
  <!-- Гарда (поперечина) -->
  <rect x="9" y="22" width="14" height="2.2" fill="currentColor"/>
  <!-- Рукоять -->
