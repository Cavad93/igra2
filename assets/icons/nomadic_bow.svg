<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor">
  <!-- Составной кочевой лук со стрелой -->
  <!-- Дуга лука (двойная кривизна — рекурсивный лук) -->
  <path d="M8,4 Q4,8 6,16 Q4,24 8,28" stroke-width="2" fill="none"/>
  <!-- Тетива -->
  <line x1="8" y1="4" x2="8" y2="28" stroke-width="1.2"/>
  <!-- Стрела поверх -->
  <line x1="9" y1="16" x2="28" y2="16" stroke-width="1.6" stroke="currentColor"/>
  <!-- Наконечник стрелы -->
  <polygon points="28,13 30,16 28,19" fill="currentColor"/>
  <!-- Оперение -->
  <polygon points="9,16 12,14 12,18" fill="currentColor"/>
  <line x1="11" y1="14" x2="13" y2="13" stroke-width="0.8"/>
  <line x1="11" y1="18" x2="13" y2="19" stroke-width="0.8"/>
</svg>
