<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"
     viewBox="0 0 60 60" fill="none">
  <!-- arma.md Шаг 59 — Египетский декоративный бордюр (лотосы/иероглифика) -->
  <rect width="60" height="60" fill="none"/>
  <rect x="1" y="1" width="58" height="58"
        stroke="rgba(180,140,60,0.5)" stroke-width="1" fill="none"/>
  <!-- Двойная линия в верхней части -->
  <line x1="4" y1="6"  x2="56" y2="6"  stroke="rgba(180,140,60,0.45)" stroke-width="1"/>
  <line x1="4" y1="10" x2="56" y2="10" stroke="rgba(180,140,60,0.45)" stroke-width="1"/>
  <line x1="4" y1="50" x2="56" y2="50" stroke="rgba(180,140,60,0.45)" stroke-width="1"/>
  <line x1="4" y1="54" x2="56" y2="54" stroke="rgba(180,140,60,0.45)" stroke-width="1"/>
  <!-- Стилизованные лотосы (капли) в ряд -->
  <circle cx="10" cy="30" r="2.5" fill="rgba(180,140,60,0.4)"/>
  <circle cx="20" cy="30" r="2.5" fill="rgba(180,140,60,0.4)"/>
  <circle cx="30" cy="30" r="2.5" fill="rgba(180,140,60,0.4)"/>
  <circle cx="40" cy="30" r="2.5" fill="rgba(180,140,60,0.4)"/>
  <circle cx="50" cy="30" r="2.5" fill="rgba(180,140,60,0.4)"/>
</svg>
