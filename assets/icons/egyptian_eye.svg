<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="currentColor">
  <!-- Око Гора (упрощённое) -->
  <!-- Контур глаза -->
  <path d="M2,16 Q12,6 22,16 Q12,22 2,16 Z" fill="none"
        stroke="currentColor" stroke-width="1.6"/>
  <!-- Зрачок -->
  <circle cx="13" cy="16" r="3" fill="currentColor"/>
  <!-- Радужка -->
  <circle cx="13" cy="16" r="1.2" fill="#000" opacity="0.5"/>
  <!-- Бровь над глазом -->
  <path d="M3,12 Q12,7 22,11" fill="none" stroke="currentColor"
        stroke-width="1.4"/>
  <!-- Хвост вниз (характерная линия око Гора) -->
