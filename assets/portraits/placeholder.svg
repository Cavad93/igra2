  <!-- Плечи -->
  <ellipse cx="48" cy="90" rx="36" ry="20" fill="rgb(120,92,58)"/>
  <!-- Голова (силуэт) -->
  <ellipse cx="48" cy="45" rx="30" ry="38" fill="rgb(170,135,95)"/>
  <!-- Глаза -->
  <ellipse cx="37.5" cy="38" rx="4" ry="3" fill="#1a1008"/>
  <ellipse cx="58.5" cy="38" rx="4" ry="3" fill="#1a1008"/>
  <!-- Рот -->
